apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
spec:
  replicas: 3                  # more than one pod so updates can roll without downtime
  selector:
    matchLabels:
      app: weather-ml-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never remove a working pod before its replacement is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: weather-ml-app
    spec:
      containers:
        - name: weather-ml-app
          image: IMAGE_PLACEHOLDER   # swapped for username/weather-ml-app:<VERSION> by CD.yml
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
