name: CD

# (g) Runs only after CI has finished successfully on main
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: weather-ml-app

jobs:
  deploy:
    # Only deploy passed builds
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Self-hosted runner installed on the Production Server (same user that runs minikube)
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read image version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      # Rolling update: swap the image on the existing Deployment (created by the Ansible playbook).
      # Kubernetes replaces the pods one at a time, so the app stays up.
      - name: Roll out the new image
        run: |
          kubectl set image deployment/weather-ml-app \
            weather-ml-app=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Wait for rollout to finish
        run: kubectl rollout status deployment/weather-ml-app --timeout=180s

      - name: Show deployed state
        run: |
          kubectl get pods -l app=weather-ml-app -o wide
          kubectl get svc weather-ml-app-service
          kubectl get deployment weather-ml-app -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
