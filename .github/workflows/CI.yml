name: CI

# (a) Detect changes: run on every push to main, on pull requests, or manually
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: weather-ml-app

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read image version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # (b) Install Flask and everything in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # (c) Each test file in its own step
      - name: Run smoke test
        run: python -m unittest tests/smoke_test.py -v

      - name: Run unit test
        run: python -m unittest tests/unit_test.py -v

      - name: Run integration test
        run: python -m unittest tests/integration_test.py -v

      # (d) Build the Docker image (loaded locally so it can be tested before pushing)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      # (e) Build test: start a container and run a command inside it
      - name: Test container launches
        run: |
          docker run -d --name build-test -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          sleep 10
          docker ps
          docker exec build-test python -c "import urllib.request; print('HTTP status:', urllib.request.urlopen('http://localhost:5000').status)"
          docker rm -f build-test

      # (f) Push the image to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
