---
- name: A playbook to install Docker, kubectl and Minikube, then deploy an app
  hosts: localhost
  connection: local
  remote_user: ubuntu
  become: yes

  vars:
    app_user: ubuntu
    work_dir: /home/ubuntu/ansible
    app_name: weather-ml-app
    app_image: connormcpike/weather-ml-app:v1
    container_port: 5000
    docker_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

  tasks:
    - name: 1. Update APT Package Manager
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Uninstall the unscd package
      apt:
        name: unscd
        state: absent

    - name: 3. Install dependency packages
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - software-properties-common
        - conntrack

    - name: 4. Get APT Key
      shell:
        cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/docker.gpg
        creates: /etc/apt/trusted.gpg.d/docker.gpg

    - name: 5. Confirm Fingerprint
      shell:
        cmd: gpg --show-keys --with-fingerprint /etc/apt/trusted.gpg.d/docker.gpg | tr -d ' '
      register: docker_key
      changed_when: false
      failed_when: docker_fingerprint not in docker_key.stdout

    - name: 6. Add APT Repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: 7. Update Package Manager
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 8. Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: 9. Make sure Docker is running and starts on boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: 10. Add the ubuntu user to the docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    - name: 11. Find the latest stable kubectl version
      uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: yes
      register: kubectl_version

    - name: 12. Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: 13. Install Minikube
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"

    - name: 14. Check if Minikube is already running
      become: no
      command: sg docker -c "minikube status"
      register: minikube_status
      changed_when: false
      failed_when: false

    - name: 15. Start Minikube
      become: no
      command: sg docker -c "minikube start --driver=docker --memory=2500mb"
      when: minikube_status.rc != 0

    - name: 16. Create a folder for the Kubernetes files
      become: no
      file:
        path: "{{ work_dir }}"
        state: directory

    - name: 17. Write the Deployment and Service file
      become: no
      copy:
        dest: "{{ work_dir }}/{{ app_name }}.yaml"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ app_name }}
          spec:
            selector:
              matchLabels:
                app: {{ app_name }}
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            template:
              metadata:
                labels:
                  app: {{ app_name }}
              spec:
                containers:
                  - name: {{ app_name }}
                    image: {{ app_image }}
                    ports:
                      - containerPort: {{ container_port }}
                    readinessProbe:
                      tcpSocket:
                        port: {{ container_port }}
                      initialDelaySeconds: 5
                      periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ app_name }}-service
          spec:
            type: NodePort
            selector:
              app: {{ app_name }}
            ports:
              - port: 80
                targetPort: {{ container_port }}

    - name: 18. Deploy the image from Docker Hub and create the Service
      become: no
      command: kubectl apply -f {{ work_dir }}/{{ app_name }}.yaml
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: 19. Get the pods
      become: no
      command: kubectl get pods -l app={{ app_name }} -o wide
      register: pods
      changed_when: false

    - name: 20. Get the app's URL
      become: no
      command: sg docker -c "minikube service {{ app_name }}-service --url"
      register: app_url
      changed_when: false

    - name: 21. Show the pods and URL
      debug:
        msg:
          - "{{ pods.stdout_lines }}"
          - "App URL: {{ app_url.stdout }}"
